line-length = 120

[format]
preview = true

[lint]
preview = true
extend-select = [
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I",
    # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PTH",
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP",
]
ignore = [
    # Tons of violations, will be revisited later.
    # https://docs.astral.sh/ruff/rules/mutable-class-default/#mutable-class-default-ruf012
    "RUF012",
]
