name: "Build docs"

on:
  push:
    branches:
      - main
  pull_request: ~

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: 3.11.15
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.12.1
  # renovate: datasource=pypi depName=sphinx
  SPHINX_VERSION: 9.0.4

jobs:
  build-docs:
    name: "Build docs"
    runs-on: ubuntu-24.04
    timeout-minutes: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv ${{ env.UV_VERSION }} & Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}

      - name: Setup project and install dependencies
        run: uv sync --group docs

      - name: Build docs
        working-directory: ./docs
        run: uv run --with "sphinx==${SPHINX_VERSION}" make html
