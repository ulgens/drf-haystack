name: "Release"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}

permissions: {}

env:
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: 3.14
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.12.9

jobs:
  release:
    name: Build & publish to PyPI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write  # needed for OIDC-based PyPI publishing
      attestations: write  # needed for build provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv ${{ env.UV_VERSION }} & Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # Purposefully disabling cache for release operations
          enable-cache: false
          python-version: ${{ env.PYTHON_VERSION }}
          version: ${{ env.UV_VERSION }}

      - name: Build package
        run: uv build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        run: uv publish
